<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Helper Pro</title>
<meta name="theme-color" content="#ffffff">
<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
  --purple:#8b5cf6;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); font-family:sans-serif; padding-bottom:90px; color:var(--text); }
.topbar{ background:#fff; padding:20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
.subtitle{ color:var(--muted); font-size:14px; }
.clock-box{ font-weight:bold; color:var(--purple); font-size:14px; }
main{ max-width:1200px; margin:auto; padding:20px; }
.hero-card, .card{ background:#fff; border-radius:20px; padding:20px; margin-bottom:20px; box-shadow:0 8px 24px rgba(0,0,0,.05); }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin-top:10px; }
.stat{ background:#fafafa; padding:15px; border-radius:15px; text-align:center; }
.stat strong{ display:block; font-size:20px; margin-top:5px; color:var(--purple); }
.card-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
input, button.input-btn{ padding:10px; border-radius:10px; border:1px solid #ddd; font-size:14px; }
input{ width:100%; margin-bottom:10px; }
.empty{ text-align:center; padding:30px; color:#777; }
.event-card, .group-item, .favorite-item{ padding:15px; border:1px solid #eee; border-radius:15px; margin-bottom:10px; background:#fafafa; display:flex; justify-content:space-between; align-items:center; }
.countdown{ font-size:16px; font-weight:bold; color:var(--purple); }
.action-btn{ background:var(--purple); color:#fff; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:bold; }
.delete-btn{ background:#ef4444; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
.bottom-nav{ position:fixed; bottom:0; left:0; right:0; height:70px; background:#fff; display:flex; border-top:1px solid #ddd; z-index:100; }
.nav-btn{ flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); }
.nav-btn.active{ color:var(--purple); font-weight:bold; }
@media(max-width:768px){
  .grid{ grid-template-columns:1fr; }
  .stats{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header class="topbar">
<div>
<h1>🎫 Ticket Helper Pro</h1>
<p class="subtitle">티켓팅 일정 및 URL 관리</p>
</div>
<div class="clock-box">
<div id="clock"></div>
</div>
</header>

<main>
<section class="hero">
<div class="hero-card">
<div style="display:flex; justify-content:space-between; align-items:center;">
<h2>오늘 일정 대시보드</h2>
<button class="action-btn" onclick="requestNotificationPermission()">🔔 알림 권한 허용</button>
</div>
<div class="stats">
<div class="stat"><span>공연</span><strong id="eventCount">0</strong></div>
<div class="stat"><span>URL</span><strong id="urlCount">0</strong></div>
<div class="stat"><span>즐겨찾기</span><strong id="favoriteCount">0</strong></div>
</div>
</div>
</section>

<section class="grid">
<div class="card">
<div class="card-header">
<h2>⏱ 공연 목록</h2>
</div>
<div style="margin-bottom:15px;">
<input type="text" id="eventTitleInput" placeholder="공연 제목 입력">
<input type="datetime-local" id="eventDateInput">
<button class="action-btn" style="width:100%; margin-top:5px;" onclick="addEvent()">공연 일정 추가</button>
</div>
<div id="eventList"></div>
</div>

<div class="card">
<div class="card-header">
<h2>🌐 URL 그룹 관리</h2>
</div>
<div style="margin-bottom:15px;">
<input type="text" id="urlTitleInput" placeholder="사이트 이름 (예: 예스24)">
<input type="text" id="urlLinkInput" placeholder="주소 (https://...)">
<button class="action-btn" style="width:100%; margin-top:5px;" onclick="addUrl()">URL 추가</button>
</div>
<div id="urlList"></div>
</div>
</section>

<section class="card">
<div class="card-header">
<h2>⭐ 즐겨찾기 URL 검색</h2>
<input id="searchInput" type="text" placeholder="URL 검색...">
</div>
<div id="favoriteList"></div>
</section>

<section class="card">
<div class="card-header">
<h2>📋 활동 로그</h2>
</div>
<div id="logList"></div>
</section>
</main>

<nav class="bottom-nav">
<button class="nav-btn active">🏠<span>홈</span></button>
<button class="nav-btn">🎫<span>공연</span></button>
<button class="nav-btn">🌐<span>URL</span></button>
<button class="nav-btn">📋<span>로그</span></button>
<button class="nav-btn">⚙️<span>설정</span></button>
</nav>

<script>
// 로컬스토리지 데이터 로드 또는 기본값 설정
let events = JSON.parse(localStorage.getItem('ticket_events')) || [
  { id: 1, title: "예시 콘서트", date: "2026-12-31T20:00" }
];

let urls = JSON.parse(localStorage.getItem('ticket_urls')) || [
  { id: 1, title: "티켓링크", url: "https://www.ticketlink.co.kr", favorite: true },
  { id: 2, title: "예스24 티켓", url: "https://ticket.yes24.com", favorite: true }
];

let logs = JSON.parse(localStorage.getItem('ticket_logs')) || [
  { text: "앱이 정상적으로 실행되었습니다.", time: new Date().toLocaleTimeString() }
];

const $ = id => document.getElementById(id);

// 시계 업데이트
function updateClock(){
  $("clock").textContent = new Date().toLocaleString("ko-KR");
}
setInterval(updateClock, 1000);
updateClock();

// 로그 추가 함수
function addLog(text) {
  logs.unshift({ text, time: new Date().toLocaleTimeString() });
  if(logs.length > 20) logs.pop();
  localStorage.setItem('ticket_logs', JSON.stringify(logs));
  renderLogs();
}

// 알림 권한 요청
function requestNotificationPermission() {
  if (!("Notification" in window)) {
    alert("이 브라우저는 알림을 지원하지 않습니다.");
    return;
  }
  Notification.requestPermission().then(permission => {
    if (permission === "granted") {
      alert("알림 권한이 허용되었습니다!");
      addLog("알림 권한이 허용되었습니다.");
    } else {
      alert("알림 권한이 거부되었습니다.");
    }
  });
}

function sendNotification(title, body) {
  if (Notification.permission === "granted") {
    new Notification(`🎫 티켓팅 알림: ${title}`, { body });
  }
}

// 카운트다운 텍스트 계산
function getCountdownText(targetDateStr) {
  const now = new Date();
  const target = new Date(targetDateStr);
  const diff = target - now;

  if (diff <= 0) return "티켓팅 시작 또는 종료됨";

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / 1000 / 60) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  if (days > 0) {
    return `D-${days} (${hours}시간 전)`;
  }
  return `⏱ ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

// 공연 추가
function addEvent() {
  const title = $("eventTitleInput").value.trim();
  const date = $("eventDateInput").value;

  if(!title || !date) {
    alert("공연 제목과 날짜를 모두 입력해주세요!");
    return;
  }

  events.push({ id: Date.now(), title, date });
  localStorage.setItem('ticket_events', JSON.stringify(events));
  
  $("eventTitleInput").value = "";
  $("eventDateInput").value = "";

  updateUI();
  addLog(`공연 등록: ${title}`);
}

// 공연 삭제
function deleteEvent(id) {
  events = events.filter(e => e.id !== id);
  localStorage.setItem('ticket_events', JSON.stringify(events));
  updateUI();
}

// URL 추가
function addUrl() {
  const title = $("urlTitleInput").value.trim();
  let url = $("urlLinkInput").value.trim();

  if(!title || !url) {
    alert("사이트 이름과 URL을 모두 입력해주세요!");
    return;
  }

  if(!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
  }

  urls.push({ id: Date.now(), title, url, favorite: true });
  localStorage.setItem('ticket_urls', JSON.stringify(urls));

  $("urlTitleInput").value = "";
  $("urlLinkInput").value = "";

  updateUI();
  addLog(`URL 추가: ${title}`);
}

// URL 삭제
function deleteUrl(id) {
  urls = urls.filter(u => u.id !== id);
  localStorage.setItem('ticket_urls', JSON.stringify(urls));
  updateUI();
}

// 렌더링 함수들
function renderEvents() {
  const list = $("eventList");
  list.innerHTML = "";
  if(events.length === 0) {
    list.innerHTML = '<div class="empty">등록된 공연이 없습니다.</div>';
    return;
  }
  events.forEach(event => {
    list.innerHTML += `
      <div class="event-card">
        <div>
          <div style="font-weight:bold; margin-bottom:3px;">${event.title}</div>
          <div style="font-size:12px; color:var(--muted);">${event.date.replace('T', ' ')}</div>
          <div class="countdown" style="margin-top:5px;">${getCountdownText(event.date)}</div>
        </div>
        <button class="delete-btn" onclick="deleteEvent(${event.id})">삭제</button>
      </div>
    `;
  });
}

function renderUrls() {
  const list = $("urlList");
  list.innerHTML = "";
  if(urls.length === 0) {
    list.innerHTML = '<div class="empty">등록된 URL이 없습니다.</div>';
    return;
  }
  urls.forEach(u => {
    list.innerHTML += `
      <div class="group-item">
        <div>
          <a href="${u.url}" target="_blank" style="font-weight:bold; color:var(--purple); text-decoration:none;">🔗 ${u.title}</a>
        </div>
        <button class="delete-btn" onclick="deleteUrl(${u.id})">삭제</button>
      </div>
    `;
  });
}

function renderFavorites(filterText = "") {
  const list = $("favoriteList");
  list.innerHTML = "";
  const filtered = urls.filter(u => u.title.toLowerCase().includes(filterText.toLowerCase()));
  if(filtered.length === 0) {
    list.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }
  filtered.forEach(u => {
    list.innerHTML += `
      <div class="favorite-item">
        <a href="${u.url}" target="_blank" style="color:var(--purple); font-weight:bold; text-decoration:none;">⭐ ${u.title} (${u.url})</a>
      </div>
    `;
  });
}

function renderLogs() {
  const list = $("logList");
  if(logs.length === 0) {
    list.innerHTML = '<div class="empty">기록 없음</div>';
    return;
  }
  list.innerHTML = "";
  logs.forEach(log => {
    list.innerHTML += `
      <div style="padding:8px 0; border-bottom:1px solid #eee; font-size:13px;">
        <span style="color:var(--muted); margin-right:5px;">[${log.time}]</span> ${log.text}
      </div>
    `;
  });
}

function updateStats() {
  $("eventCount").textContent = events.length;
  $("urlCount").textContent = urls.length;
  $("favoriteCount").textContent = urls.filter(x => x.favorite).length;
}

function updateUI() {
  updateStats();
  renderEvents();
  renderUrls();
  renderFavorites($("searchInput").value);
  renderLogs();
}

// 실시간 타이머 및 알림 트리거 체크
setInterval(() => {
  renderEvents();
  const now = new Date();
  events.forEach(event => {
    const target = new Date(event.date);
    const diff = target - now;
    if (diff > 0 && diff <= 1000) {
      sendNotification(event.title, "정각입니다! 티켓팅을 시작하세요!");
      addLog(`[알림] ${event.title} 티켓팅 시작!`);
    }
  });
}, 1000);

$("searchInput").addEventListener("input", (e) => {
  renderFavorites(e.target.value);
});

// 초기 실행
updateUI();
</script>
</body>
</html>
