<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticket Helper Pro</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="app">
<h1>🎫 Ticket Helper Pro</h1>
<div class="card"><div id="clock"></div><div id="countdown">00:00:00.000</div></div>
<div class="card">
<input id="target" type="datetime-local">
<button id="start">시작</button><button id="stop">중지</button>
</div>
<div class="card">
<input id="url" placeholder="URL 추가">
<button id="add">추가</button>
<ul id="urls"></ul>
</div>
<div class="card">
<label>테마</label>
<select id="theme"><option>dark</option><option>light</option></select>
<button id="notify">알림 권한 요청</button>
</div>
<div id="status"></div>
</div>
<script src="js/app.js"></script></body></html>
